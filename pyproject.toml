[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "jitpi05"
version = "0.1.0"
description = "Hierarchical VLA and JitRL research experiments for LIBERO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.12,<2",
    "bitsandbytes>=0.49,<0.50",
    "flash-linear-attention[cuda]>=0.5.1,<0.6",
    "socksio>=1.0.0,<2",
    "lerobot[evaluation,libero,pi]>=0.6,<0.7",
    "numpy>=2.0,<2.3",
    "pillow>=10,<13",
    "pydantic>=2.12,<3",
    "pydantic-ai>=2.18,<3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.66,<5",
    "transformers>=5.5,<5.6",
]

[project.scripts]
jitpi05-offline = "jitpi05.cli.offline:main"
jitpi05-eval-sim = "jitpi05.cli.simulation:main"
jitpi05-eval-jitrl = "jitpi05.cli.jitrl:main"
jitpi05-doctor = "jitpi05.cli.doctor:main"
jitpi05-report = "jitpi05.reporting.generate:main"

[dependency-groups]
dev = [
    "pytest>=8.1,<9",
    "ruff>=0.14,<0.17",
]
report = [
    "matplotlib>=3.9,<4",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires the supported Linux CUDA runtime",
    "integration: exercises installed command or environment boundaries",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
